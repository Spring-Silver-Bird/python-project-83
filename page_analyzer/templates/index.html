<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Анализатор страниц{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='output.css') }}">
</head>
<body class="min-h-screen flex flex-col bg-slate-100">
  <header class="bg-slate-900">
    <nav class="mx-auto flex w-full max-w-5xl items-center justify-between px-4 py-3">
      <a href="{{ url_for('index') }}" class="text-xl font-semibold text-white">Анализатор страниц</a>
      <a href="{{ url_for('urls') }}" class="text-slate-300 hover:text-white">Сайты</a>
    </nav>
  </header>

  <main class="flex-1">
    <div class="mx-auto w-full max-w-5xl px-4 py-6">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div role="alert" class="mb-4 rounded-md border px-4 py-3
          {% if category == 'success' %}border-emerald-300 bg-emerald-50 text-emerald-800
          {% elif category == 'danger' %}border-red-300 bg-red-50 text-red-800
          {% else %}border-sky-300 bg-sky-50 text-sky-800{% endif %}">
            {{ message }}
          </div>
        {% endfor %}
      {% endwith %}

      {% block content %}
      <div class="mx-auto mt-8 max-w-2xl">
        <div class="rounded-xl border border-slate-200 bg-white p-8 shadow-sm">
          <h1 class="text-4xl font-bold text-slate-900">Анализатор страниц</h1>
          <p class="mt-2 text-lg text-slate-600">Бесплатно проверяйте сайты на SEO-пригодность</p>
          <form action="{{ url_for('add_url') }}" method="post" class="mt-6 flex items-center gap-3">
            <label for="url" class="sr-only">URL для проверки</label>
            <input
              type="text"
              id="url"
              name="url"
              placeholder="https://www.example.com"
              value="{{ url }}"
              class="w-full rounded-md border border-slate-300 bg-white px-3 py-2.5 text-sm shadow-sm placeholder:text-slate-400 focus:border-emerald-500 focus:outline-none focus:ring-2 focus:ring-emerald-500/30"
              required
            >
            <button
              type="submit"
              class="shrink-0 rounded-md bg-emerald-600 px-6 py-2.5 font-medium uppercase text-white hover:bg-emerald-700"
            >
              Проверить
            </button>
          </form>
        </div>
      </div>
      {% endblock %}
    </div>
  </main>
</body>
</html>
